        :root{--bg:#0a1628;--surface:#0f2040;--surface2:#162a50;--border:rgba(100,160,255,0.12);--accent:#3d8bff;--accent2:#00e5c8;--text:#e8f0ff;--muted:#7899cc;--success:#00c9a7;--warning:#ffbe5c;--danger:#ff5f5f}

        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% -10%,rgba(61,139,255,0.12) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 110%,rgba(0,229,200,0.08) 0%,transparent 60%);pointer-events:none;z-index:0}

        /* Header */
        .header{text-align:center;margin-bottom:32px;padding-top:10px}
        .header-logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px}
        .logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7em;box-shadow:0 0 24px rgba(61,139,255,0.35)}
        .header h1{font-size:1.9em;font-weight:700;letter-spacing:-0.5px;margin-bottom:8px}
        .subtitle{color:var(--muted);font-size:1em;margin-bottom:20px}
        
        /* Navigation */
        .nav-tabs{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding-bottom:4px}
        .nav-tabs::-webkit-scrollbar{height:4px}
        .nav-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .nav-tab{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:10px 20px;border-radius:12px;font-size:.88em;cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:500}
        .nav-tab:active{transform:scale(0.98)}
        .nav-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(61,139,255,0.3)}
        
        /* Search Bar */
        .search-container{margin-bottom:24px}
        .search-box{width:100%;padding:14px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:.95em;font-family:'Outfit',sans-serif;outline:none;transition:border-color .3s}
        .search-box:focus{border-color:rgba(61,139,255,.4)}
        .search-box::placeholder{color:var(--muted)}
        
        /* Cards */
        .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:18px;transition:border-color .3s,transform .3s;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 60%);pointer-events:none}
        .card:hover{border-color:rgba(61,139,255,.3);transform:translateY(-2px)}
        
        /* Fish Grid */
        .fish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
        .fish-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
        .fish-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 60%);pointer-events:none}
        .fish-card:hover{border-color:rgba(61,139,255,.4);transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
        .fish-card:active{transform:scale(0.98)}
        .fish-icon{font-size:3em;text-align:center;margin-bottom:12px}
        .fish-name{font-size:1.15em;font-weight:700;margin-bottom:6px;text-align:center;color:var(--accent2)}
        .fish-scientific{font-size:.75em;color:var(--muted);text-align:center;font-style:italic;margin-bottom:12px}
        .fish-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
        .fish-tag{background:rgba(61,139,255,.15);color:var(--accent);padding:4px 10px;border-radius:12px;font-size:.7em;font-weight:600}
        
        /* Detail View */
        .detail-view{display:none}
        .detail-view.active{display:block}
        .detail-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap}
        .detail-icon{font-size:5em;flex-shrink:0}
        .detail-info{flex:1}
        .detail-title{font-size:2em;font-weight:700;margin-bottom:8px;color:var(--accent2)}
        .detail-scientific{font-size:1em;color:var(--muted);font-style:italic;margin-bottom:12px}
        .detail-tags{display:flex;gap:8px;flex-wrap:wrap}
        .detail-tag{background:rgba(61,139,255,.15);color:var(--accent);padding:6px 14px;border-radius:14px;font-size:.8em;font-weight:600}
        
        .back-btn{background:var(--surface2);color:var(--accent);border:1px solid var(--border);padding:10px 20px;border-radius:12px;font-size:.88em;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;font-family:'Outfit',sans-serif}
        .back-btn:hover{background:rgba(61,139,255,.12);border-color:rgba(61,139,255,.3)}
        .back-btn:active{transform:scale(0.98)}
        
        /* Info Sections */
        .info-section{margin-bottom:28px}
        .info-title{font-size:1.2em;font-weight:700;margin-bottom:14px;color:var(--accent);display:flex;align-items:center;gap:10px}
        .info-content{line-height:1.8;color:var(--text);font-size:.95em}
        .info-content p{margin-bottom:12px}
        .info-list{list-style:none;padding:0}
        .info-list li{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
        .info-list li:last-child{border-bottom:none}
        .info-list-icon{color:var(--accent2);font-size:1.2em;flex-shrink:0;margin-top:2px}
        
        /* Stats Grid */
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
        .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
        .stat-label{font-size:.72em;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px}
        .stat-value{font-family:'DM Mono',monospace;font-size:1.4em;font-weight:600;color:var(--accent2)}
        
        /* Tips Box */
        .tips-box{background:rgba(0,229,200,.08);border:1px solid rgba(0,229,200,.2);border-radius:14px;padding:18px;margin-bottom:20px}
        .tips-title{color:var(--accent2);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .tips-content{color:var(--text);line-height:1.7;font-size:.9em}
        
        /* Warning Box */
        .warning-box{background:rgba(255,190,92,.08);border:1px solid rgba(255,190,92,.2);border-radius:14px;padding:18px;margin-bottom:20px}
        .warning-title{color:var(--warning);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .warning-content{color:var(--text);line-height:1.7;font-size:.9em}
        
        /* Bottom Navigation */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-around;z-index:1000;backdrop-filter:blur(10px)}
        .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:.75em;transition:all .2s;padding:8px 16px;border-radius:12px}
        .bottom-nav-item.active{background:rgba(61,139,255,.15);color:var(--accent)}
        .bottom-nav-item:active{transform:scale(0.95)}
        .bottom-nav-icon{font-size:1.6em}
        
        @media(max-width:768px){
            .fish-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
            .fish-card{padding:16px}
            .fish-icon{font-size:2.5em}
            .detail-header{flex-direction:column;align-items:center;text-align:center}
            .stats-grid{grid-template-columns:repeat(2,1fr)}
        }
    </style>
</head>

                tips: 'Haruan sangat bernilai tinggi dalam pasaran. Ekstrak haruan digunakan untuk penyembuhan luka. Perlukan pengurusan teliti kerana sifat agresif.',
                warnings: 'BAHAYA: Haruan boleh melompat keluar dari kolam. Tutup kolam dengan jaring. Jangan campur ikan saiz berbeza - akan dimakan!'
            },
            {
                id: 'lampam',
                name: 'Lampam Jawa',
                scientific: 'Barbonymus gonionotus',
                icon: '🐟',
                category: 'carp',
                tags: ['Cepat besar', 'Sedap', 'Tempatan'],
                stats: {
                    'Suhu Ideal': '25-30°C',
                    'pH Ideal': '6.5-7.5',
                    'Saiz Dewasa': '25-35 cm',
                    'Tempoh Panen': '6-8 bulan'
                },
                description: 'Lampam Jawa adalah ikan air tawar tempatan yang popular. Daging putih dan sedap, mudah dipelihara.',
                care: [
                    { icon: '🌡️', text: 'Sesuai iklim Malaysia' },
                    { icon: '💧', text: 'Suka air mengalir' },
                    { icon: '🍽️', text: 'Omnivora - mudah diberi makan' },
                    { icon: '🏊', text: 'Suka berenang - kolam luas' },
                    { icon: '👥', text: 'Hidup berkumpulan' }
                ],
                feeding: 'Omnivora. Pellet dengan protein 28-32%, sayuran, dan makanan hidup. Beri makan 2-3 kali sehari.',
                diseases: [
                    { name: 'White Spot', prevention: 'Suhu stabil' },
                    { name: 'Fin Rot', prevention: 'Air bersih' }
                ],
                tips: 'Lampam sesuai untuk kolam aliran. Mereka aktif dan suka air beroksigen tinggi. Harga pasaran yang baik.',
                warnings: 'Perlukan oksigen mencukupi. Sistem pengudaraan penting untuk kepadatan tinggi.'
            }
        ];
        
        // Guides Database
        const guidesDatabase = [
            {
                id: 'water-quality',
                name: 'Kualiti Air',
                icon: '💧',
                category: 'guides',
                tags: ['Asas', 'Penting'],
                description: 'Panduan lengkap tentang pengurusan kualiti air dalam kolam ikan.',
                sections: [
                    {
                        title: 'Parameter Penting',
                        content: 'pH: 6.5-8.5 untuk kebanyakan ikan\nSuhu: 25-30°C (tropika)\nAmmonia: 0 ppm (toksik)\nNitrit: <0.5 ppm\nNitrat: <40 ppm\nOksigen: >5 mg/L'
                    },
                    {
                        title: 'Ujian Air',
                        content: 'Uji pH dan suhu setiap hari\nUji ammonia dan nitrit setiap minggu\nUji nitrat setiap 2 minggu\nGuna kit ujian yang berkualiti'
                    },
                    {
                        title: 'Penyelenggaraan',
                        content: 'Tukar 20-30% air setiap minggu\nBersihkan penapis setiap bulan\nSifon sisa makanan dan najis\nElakkan perubahan parameter secara tiba-tiba'
                    }
                ]
            },
            {
                id: 'feeding-guide',
                name: 'Panduan Pemberian Makan',
                icon: '🍽️',
                category: 'guides',
                tags: ['Pemakanan', 'Pertumbuhan'],
                description: 'Cara memberi makan ikan dengan betul untuk pertumbuhan optimum.',
                sections: [
                    {
                        title: 'Kekerapan',
                        content: 'Benih (1-3 bulan): 4-5 kali sehari\nJuvenil (3-6 bulan): 3-4 kali sehari\nDewasa: 2-3 kali sehari\nJangan beri makan berlebihan'
                    },
                    {
                        title: 'Jumlah Makanan',
                        content: 'Benih: 5-8% berat badan\nJuvenil: 3-5% berat badan\nDewasa: 2-3% berat badan\nHabiskan dalam 5-10 minit'
                    },
                    {
                        title: 'Jenis Makanan',
                        content: 'Pellet: Mudah dan seimbang\nMakanan hidup: Artemia, cacing\nSayuran: Bayam, sawi (untuk omnivora)\nPilih pellet berkualiti dengan protein sesuai'
                    }
                ]
            },
            {
                id: 'disease-prevention',
                name: 'Pencegahan Penyakit',
                icon: '🏥',
                category: 'guides',
                tags: ['Kesihatan', 'Penting'],
                description: 'Cara mencegah dan mengesan penyakit ikan pada peringkat awal.',
                sections: [
                    {
                        title: 'Tanda-tanda Sihat',
                        content: 'Aktif dan berenang normal\nSelera makan baik\nWarna cerah\nSirip tegak\nTiada luka atau bintik'
                    },
                    {
                        title: 'Tanda Penyakit',
                        content: 'Berenang tidak normal\nTidak makan\nWarna pudar\nBintik putih/merah\nSirip rosak\nBernafas pantas'
                    },
                    {
                        title: 'Pencegahan',
                        content: 'Karantina ikan baru 2-4 minggu\nJaga kualiti air\nElakkan stress\nDensity sesuai\nPemakanan berkualiti\nPenapis berfungsi baik'
                    }
                ]
            }
        ];
        
        let currentView = 'grid';
        let currentTab = 'all';
        
        // Initialize
        function init() {
            renderFishGrid('all');
        }
        
        // Switch Tab
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if(tab === 'guides') {
                renderGuidesGrid();
            } else {
                renderFishGrid(tab);
            }
        }
        
        // Render Fish Grid
        function renderFishGrid(category) {
            const grid = document.getElementById('fishGrid');
            const filtered = category === 'all' 
                ? fishDatabase 
                : fishDatabase.filter(f => f.category === category);
            
            grid.innerHTML = filtered.map(fish => `
                <div class="fish-card" onclick="showFishDetail('${fish.id}')">
                    <div class="fish-icon">${fish.icon}</div>
                    <div class="fish-name">${fish.name}</div>
                    <div class="fish-scientific">${fish.scientific}</div>
                    <div class="fish-tags">
                        ${fish.tags.map(tag => `<span class="fish-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('gridView').style.display = 'block';
            document.getElementById('detailView').style.display = 'none';
        }
        
        // Render Guides Grid
        function renderGuidesGrid() {
            const grid = document.getElementById('fishGrid');
            grid.innerHTML = guidesDatabase.map(guide => `
                <div class="fish-card" onclick="showGuideDetail('${guide.id}')">
                    <div class="fish-icon">${guide.icon}</div>
                    <div class="fish-name">${guide.name}</div>
                    <div class="fish-scientific">${guide.description}</div>
                    <div class="fish-tags">
                        ${guide.tags.map(tag => `<span class="fish-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('gridView').style.display = 'block';
            document.getElementById('detailView').style.display = 'none';
        }
        
        // Show Fish Detail
        function showFishDetail(fishId) {
            const fish = fishDatabase.find(f => f.id === fishId);
            if(!fish) return;
            
            const detailView = document.getElementById('detailView');
            detailView.innerHTML = `
                <button class="back-btn" onclick="backToGrid()">← Kembali</button>
                
                <div class="card">
                    <div class="detail-header">
                        <div class="detail-icon">${fish.icon}</div>
                        <div class="detail-info">
                            <div class="detail-title">${fish.name}</div>
                            <div class="detail-scientific">${fish.scientific}</div>
                            <div class="detail-tags">
                                ${fish.tags.map(tag => `<span class="detail-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <div class="info-content">
                            <p>${fish.description}</p>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        ${Object.entries(fish.stats).map(([label, value]) => `
                            <div class="stat-box">
                                <div class="stat-label">${label}</div>
                                <div class="stat-value">${value}</div>
                            </div>
                        `).join('')}
                    </div>
                    
                    ${fish.tips ? `
                    <div class="tips-box">
                        <div class="tips-title">💡 Tips Berguna</div>
                        <div class="tips-content">${fish.tips}</div>
                    </div>
                    ` : ''}
                    
                    ${fish.warnings ? `
                    <div class="warning-box">
                        <div class="warning-title">⚠️ Perhatian</div>
                        <div class="warning-content">${fish.warnings}</div>
                    </div>
                    ` : ''}
                    
                    <div class="info-section">
                        <div class="info-title">🔧 Cara Penjagaan</div>
                        <ul class="info-list">
                            ${fish.care.map(item => `
                                <li>
                                    <span class="info-list-icon">${item.icon}</span>
                                    <span>${item.text}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    
                    <div class="info-section">
                        <div class="info-title">🍽️ Pemberian Makan</div>
                        <div class="info-content">
                            <p>${fish.feeding}</p>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <div class="info-title">🏥 Penyakit Biasa & Pencegahan</div>
                        <ul class="info-list">
                            ${fish.diseases.map(disease => `
                                <li>
                                    <span class="info-list-icon">⚕️</span>
                                    <span><strong>${disease.name}:</strong> ${disease.prevention}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
            
            document.getElementById('gridView').style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);
        }
        
        // Show Guide Detail
        function showGuideDetail(guideId) {
            const guide = guidesDatabase.find(g => g.id === guideId);
            if(!guide) return;
            
            const detailView = document.getElementById('detailView');
            detailView.innerHTML = `
                <button class="back-btn" onclick="backToGrid()">← Kembali</button>
                
                <div class="card">
                    <div class="detail-header">
                        <div class="detail-icon">${guide.icon}</div>
                        <div class="detail-info">
                            <div class="detail-title">${guide.name}</div>
                            <div class="detail-scientific">${guide.description}</div>
                            <div class="detail-tags">
                                ${guide.tags.map(tag => `<span class="detail-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    
                    ${guide.sections.map(section => `
                        <div class="info-section">
                            <div class="info-title">📌 ${section.title}</div>
                            <div class="info-content">
                                <p>${section.content.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('gridView').style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);
        }
        
        // Back to Grid
        function backToGrid() {
            if(currentTab === 'guides') {
                renderGuidesGrid();
            } else {
                renderFishGrid(currentTab);
            }
        }
        
        // Search
        function searchContent() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            if(!query) {
                backToGrid();
                return;
            }
            
            const allContent = [...fishDatabase, ...guidesDatabase];
            const filtered = allContent.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.scientific?.toLowerCase().includes(query) ||
                item.description.toLowerCase().includes(query) ||
                item.tags.some(tag => tag.toLowerCase().includes(query))
            );
            
            const grid = document.getElementById('fishGrid');
            grid.innerHTML = filtered.map(item => `
                <div class="fish-card" onclick="${item.category === 'guides' ? `showGuideDetail('${item.id}')` : `showFishDetail('${item.id}')`}">
                    <div class="fish-icon">${item.icon}</div>
                    <div class="fish-name">${item.name}</div>
                    <div class="fish-scientific">${item.scientific || item.description}</div>
                    <div class="fish-tags">
                        ${item.tags.map(tag => `<span class="fish-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            if(filtered.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Tiada hasil ditemui untuk "' + query + '"</div>';
            }
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
