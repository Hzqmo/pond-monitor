<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Audio Unlock</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a1628;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 22, 40, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .overlay.hidden {
            display: none;
        }
        .dialog {
            background: #162a50;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 400px;
            text-align: center;
            border: 2px solid #3d8bff;
        }
        h2 {
            margin-bottom: 15px;
            color: #00e5c8;
        }
        p {
            margin-bottom: 25px;
            color: #7899cc;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #3d8bff, #00e5c8);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 8px 24px rgba(61, 139, 255, 0.4);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 201, 167, 0.1);
            border-radius: 10px;
            color: #00c9a7;
        }
        .log {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log div {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay">
        <div class="dialog">
            <h2>🔊 Aktifkan Audio</h2>
            <p>Tekan butang di bawah untuk membolehkan suara AI bercakap di telefon anda.</p>
            <button class="btn" id="unlockBtn">Aktifkan Suara</button>
            <div class="log" id="log"></div>
        </div>
    </div>

    <div class="status" id="status" style="display: none;">
        ✅ Audio sudah diaktifkan! Boleh tutup halaman ini.
    </div>

    <script>
        const log = document.getElementById('log');
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status');
        const btn = document.getElementById('unlockBtn');

        function addLog(message) {
            console.log(message);
            const div = document.createElement('div');
            div.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        addLog('Page loaded');

        // Simple click handler
        btn.addEventListener('click', function(e) {
            addLog('Button clicked!');
            e.preventDefault();
            
            // Method 1: Play silent audio
            addLog('Attempting to play silent audio...');
            const audio = new Audio();
            audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            
            audio.play()
                .then(() => {
                    addLog('✅ Audio played successfully!');
                    overlay.classList.add('hidden');
                    status.style.display = 'block';
                })
                .catch(err => {
                    addLog('❌ Audio play failed: ' + err.message);
                    // Still hide overlay
                    overlay.classList.add('hidden');
                    status.style.display = 'block';
                });

            // Method 2: Initialize speech synthesis
            if (window.speechSynthesis) {
                addLog('Initializing speech synthesis...');
                try {
                    const utterance = new SpeechSynthesisUtterance(' ');
                    utterance.volume = 0.01;
                    window.speechSynthesis.speak(utterance);
                    addLog('✅ Speech synthesis initialized');
                } catch (err) {
                    addLog('❌ Speech synthesis failed: ' + err.message);
                }
            }
        }, false);

        // Also try touchend
        btn.addEventListener('touchend', function(e) {
            addLog('Touch event detected!');
            e.preventDefault();
            btn.click();
        }, false);

        addLog('Event listeners attached');
        addLog('Waiting for user interaction...');
    </script>
</body>
</html>
